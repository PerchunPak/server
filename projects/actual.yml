services:
  actual:
    image: actualbudget/actual-server
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'node scripts/health-check.js']
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

    volumes:
      - ${PWD}/data/actual:/data
    networks:
      - projects_caddy-net
    env_file:
      - path: ${PWD}/data/actual/.env

networks:
  projects_caddy-net:
    external: true
